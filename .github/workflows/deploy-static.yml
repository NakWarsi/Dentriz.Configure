name: Deploy Static Version

on:
  push:
    branches: ['release-static-*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  download-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download static build artifacts
        uses: actions/download-artifact@v4
        with:
          name: static-build
          path: ./static-build

      - name: List build contents
        run: ls -la ./static-build

  deploy-static-webapp:
    needs: download-build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download static build artifacts
        uses: actions/download-artifact@v4
        with:
          name: static-build
          path: ./static-build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./static-build"
          output_location: ""
          skip_app_build: true

  notify-deployment:
    needs: deploy-static-webapp
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-static-webapp.result }}" == "success" ]; then
            echo "✅ Static deployment successful!"
            echo "🌐 Static Web App URL: ${{ secrets.STATIC_WEB_APP_URL }}"
          else
            echo "❌ Static deployment failed!"
            exit 1
          fi
