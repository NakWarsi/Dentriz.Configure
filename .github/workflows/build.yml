name: Build Application

on:
  push:
    branches: ['release-static-*', 'release-dynamic-*']
  pull_request:
    branches: ['main', 'develop']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.setup-node.outputs.node-version }}
      dotnet-version: ${{ steps.setup-dotnet.outputs.dotnet-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache .NET dependencies
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

  build-static:
    needs: setup
    runs-on: ubuntu-latest
    if: contains(github.ref, 'release-static-') || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static version
        run: npm run build:static

      - name: Upload static build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: static-build
          path: dist/
          retention-days: 7

  build-dynamic:
    needs: setup
    runs-on: ubuntu-latest
    if: contains(github.ref, 'release-dynamic-') || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dynamic version
        run: npm run build:dynamic

      - name: Upload dynamic build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dynamic-build
          path: dist/
          retention-days: 7

  build-api:
    needs: setup
    runs-on: ubuntu-latest
    if: contains(github.ref, 'release-dynamic-') || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}

      - name: Restore .NET dependencies
        run: dotnet restore Dentriz.Configure.Api/Dentriz.Configure.Api.csproj

      - name: Build .NET API
        run: dotnet build Dentriz.Configure.Api/Dentriz.Configure.Api.csproj --configuration Release --no-restore

      - name: Publish .NET API
        run: dotnet publish Dentriz.Configure.Api/Dentriz.Configure.Api.csproj --configuration Release --output ./api-publish --no-build

      - name: Upload API build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: api-build
          path: api-publish/
          retention-days: 7
