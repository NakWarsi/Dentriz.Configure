name: Build Application

on:
  push:
    branches: ['release-static-*']
  pull_request:
    branches: ['main', 'develop']

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.setup-node.outputs.node-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  build-static:
    needs: setup
    runs-on: ubuntu-latest
    if: contains(github.ref, 'release-static-') || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static version
        run: npm run build:static

      - name: Upload static build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: dist/
          retention-days: 7

  build-dynamic:
    needs: setup
    runs-on: ubuntu-latest
    if: contains(github.ref, 'release-dynamic-') || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dynamic version
        run: npm run build:dynamic

      - name: Upload dynamic build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-build
          path: dist/
          retention-days: 7

