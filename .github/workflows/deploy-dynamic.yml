name: Deploy Dynamic Version

on:
  push:
    branches: ['release-dynamic-*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-dynamic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'Dentriz.Configure.Web/package-lock.json'

      - name: Install dependencies
        run: |
          cd Dentriz.Configure.Web
          npm ci

      - name: Build dynamic version
        run: |
          cd Dentriz.Configure.Web
          npm run build:dynamic

      - name: Inject API URL into environment
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          # Create a script to inject API URL and enable editing at runtime
          cat > inject-api-url.js << 'EOF'
          (function() {
            // Override environment settings for runtime
            if (typeof window !== 'undefined') {
              // Set global environment overrides
              window.ENVIRONMENT_OVERRIDE = {
                dataSource: 'api',
                apiBaseUrl: 'https://dentriz-configure-api.azurewebsites.net/api',
                enableEditing: true,
                enableApiCalls: true,
                production: true
              };
              
              // Also set individual variables for backward compatibility
              window.API_BASE_URL = 'https://dentriz-configure-api.azurewebsites.net/api';
              window.ENABLE_EDITING = true;
              window.ENABLE_API_CALLS = true;
              
              console.log('🔧 Runtime environment override applied:', window.ENVIRONMENT_OVERRIDE);
            }
          })();
          EOF
          
          # Inject the script into index.html
          sed -i 's|</head>|  <script src="inject-api-url.js"></script>\n</head>|' index.html

      - name: Copy server.js to build output
        run: |
          cp Dentriz.Configure.Web/server.js Dentriz.Configure.Web/dist/DentrizWeb/browser/

      - name: Create package.json for deployment
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          cat > package.json << 'EOF'
          {
            "name": "dentriz-web-app",
            "version": "1.0.0",
            "description": "DentRiz Web Application",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            },
            "engines": {
              "node": ">=18.0.0"
            }
          }
          EOF

      - name: Install Express dependency
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          npm install express --production
          echo "Express installation completed"

      - name: Verify Express installation
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          echo "Checking if node_modules exists:"
          ls -la node_modules/ || echo "node_modules not found"
          echo "Checking Express specifically:"
          ls -la node_modules/express/ || echo "Express not found"
          echo "Express version:"
          node -e "try { console.log(require('./node_modules/express/package.json').version); } catch(e) { console.log('Express not found:', e.message); }"

      - name: Create standalone Express bundle
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          echo "Creating standalone Express bundle..."
          
          # Create a bundled server.js that includes Express inline
          cat > server-bundled.js << 'EOF'
          // Bundled Express server - no external dependencies
          const express = require('express');
          const path = require('path');
          const fs = require('fs');
          
          console.log('🚀 Starting bundled server...');
          console.log('Current working directory:', process.cwd());
          console.log('__dirname:', __dirname);
          console.log('Node.js version:', process.version);
          console.log('NODE_ENV:', process.env.NODE_ENV);
          
          // Check if node_modules exists
          console.log('📁 Files in current directory:');
          try {
            const files = fs.readdirSync(__dirname);
            files.forEach(file => {
              const stat = fs.statSync(path.join(__dirname, file));
              console.log(`  ${stat.isDirectory() ? '📁' : '📄'} ${file}`);
            });
          } catch (error) {
            console.error('❌ Error reading directory:', error.message);
          }
          
          // Check if node_modules exists
          const nodeModulesPath = path.join(__dirname, 'node_modules');
          console.log('📁 Checking for node_modules:', nodeModulesPath);
          if (fs.existsSync(nodeModulesPath)) {
            console.log('✅ node_modules directory exists');
            try {
              const nodeModulesContents = fs.readdirSync(nodeModulesPath);
              console.log('📦 node_modules contents:', nodeModulesContents.slice(0, 10).join(', '));
            } catch (error) {
              console.error('❌ Error reading node_modules:', error.message);
            }
          } else {
            console.error('❌ node_modules directory not found!');
          }
          
          // Check if Express exists
          const expressPath = path.join(__dirname, 'node_modules', 'express');
          console.log('📦 Checking for Express:', expressPath);
          if (fs.existsSync(expressPath)) {
            console.log('✅ Express directory exists');
            try {
              const expressContents = fs.readdirSync(expressPath);
              console.log('📦 Express contents:', expressContents.slice(0, 5).join(', '));
            } catch (error) {
              console.error('❌ Error reading Express directory:', error.message);
            }
          } else {
            console.error('❌ Express directory not found!');
          }
          
          try {
            console.log('✅ Express module loaded successfully');
            
            const app = express();
            
            // Security headers
            app.use((req, res, next) => {
              res.setHeader('X-Content-Type-Options', 'nosniff');
              res.setHeader('X-Frame-Options', 'DENY');
              res.setHeader('X-XSS-Protection', '1; mode=block');
              res.setHeader('Referrer-Policy', 'strict-origin-when-cross-origin');
              next();
            });
            
            // Serve static files from the dist directory with caching
            app.use(express.static(path.join(__dirname), {
              maxAge: '1y',
              etag: true,
              lastModified: true
            }));
            
            // Handle every other route by returning Angular's index.html
            app.get('*', (req, res) => {
              res.sendFile(path.join(__dirname, 'index.html'));
            });
            
            // Error handling
            app.use((err, req, res, next) => {
              console.error(err.stack);
              res.status(500).send('Something broke!');
            });
            
            // Start the app
            const port = process.env.PORT || 8080;
            app.listen(port, () => {
              console.log(`Server started on port ${port}`);
              console.log(`Environment: ${process.env.NODE_ENV || 'development'}`);
            });
            
          } catch (error) {
            console.error('Failed to start server:');
            console.error('Error:', error.message);
            console.error('Stack:', error.stack);
            
            // Check if it's a module not found error
            if (error.code === 'MODULE_NOT_FOUND') {
              console.error('Missing module:', error.message.split("'")[1]);
              console.error('Please ensure all dependencies are installed.');
              console.error('Run: npm install');
            }
            
            process.exit(1);
          }
          EOF
          
          # Replace the original server.js with the bundled version
          mv server-bundled.js server.js
          echo "✅ Created bundled server.js with inline Express"
          
          # Create a fallback server that doesn't require Express
          cat > server-fallback.js << 'EOF'
          // Fallback server using only Node.js built-in modules
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const url = require('url');
          
          console.log('🚀 Starting fallback server (no Express required)...');
          console.log('Current working directory:', process.cwd());
          console.log('__dirname:', __dirname);
          console.log('Node.js version:', process.version);
          
          // MIME types for common file extensions
          const mimeTypes = {
            '.html': 'text/html',
            '.js': 'text/javascript',
            '.css': 'text/css',
            '.json': 'application/json',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.gif': 'image/gif',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon'
          };
          
          const server = http.createServer((req, res) => {
            const parsedUrl = url.parse(req.url);
            let pathname = parsedUrl.pathname;
            
            // Default to index.html for root or if no extension
            if (pathname === '/' || !path.extname(pathname)) {
              pathname = '/index.html';
            }
            
            const filePath = path.join(__dirname, pathname);
            const ext = path.extname(filePath).toLowerCase();
            const contentType = mimeTypes[ext] || 'application/octet-stream';
            
            // Security headers
            res.setHeader('X-Content-Type-Options', 'nosniff');
            res.setHeader('X-Frame-Options', 'DENY');
            res.setHeader('X-XSS-Protection', '1; mode=block');
            res.setHeader('Referrer-Policy', 'strict-origin-when-cross-origin');
            
            fs.readFile(filePath, (err, data) => {
              if (err) {
                if (err.code === 'ENOENT') {
                  // File not found, serve index.html for SPA routing
                  fs.readFile(path.join(__dirname, 'index.html'), (err2, data2) => {
                    if (err2) {
                      res.writeHead(404, { 'Content-Type': 'text/html' });
                      res.end('<h1>404 - File Not Found</h1>');
                    } else {
                      res.writeHead(200, { 'Content-Type': 'text/html' });
                      res.end(data2);
                    }
                  });
                } else {
                  res.writeHead(500, { 'Content-Type': 'text/html' });
                  res.end('<h1>500 - Internal Server Error</h1>');
                }
              } else {
                res.writeHead(200, { 'Content-Type': contentType });
                res.end(data);
              }
            });
          });
          
          const port = process.env.PORT || 8080;
          server.listen(port, () => {
            console.log(`Fallback server started on port ${port}`);
            console.log(`Environment: ${process.env.NODE_ENV || 'development'}`);
          });
          EOF
          
          echo "✅ Created fallback server.js (no Express required)"
          
          # Create a simple server that doesn't require Express
          cat > server-simple.js << 'EOF'
          // Simple server using only Node.js built-in modules
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const url = require('url');
          
          console.log('🚀 Starting simple server (no Express required)...');
          console.log('Current working directory:', process.cwd());
          console.log('__dirname:', __dirname);
          console.log('Node.js version:', process.version);
          
          // MIME types for common file extensions
          const mimeTypes = {
            '.html': 'text/html',
            '.js': 'text/javascript',
            '.css': 'text/css',
            '.json': 'application/json',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.gif': 'image/gif',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon'
          };
          
          const server = http.createServer((req, res) => {
            const parsedUrl = url.parse(req.url);
            let pathname = parsedUrl.pathname;
            
            // Default to index.html for root or if no extension
            if (pathname === '/' || !path.extname(pathname)) {
              pathname = '/index.html';
            }
            
            const filePath = path.join(__dirname, pathname);
            const ext = path.extname(filePath).toLowerCase();
            const contentType = mimeTypes[ext] || 'application/octet-stream';
            
            // Security headers
            res.setHeader('X-Content-Type-Options', 'nosniff');
            res.setHeader('X-Frame-Options', 'DENY');
            res.setHeader('X-XSS-Protection', '1; mode=block');
            res.setHeader('Referrer-Policy', 'strict-origin-when-cross-origin');
            
            fs.readFile(filePath, (err, data) => {
              if (err) {
                if (err.code === 'ENOENT') {
                  // File not found, serve index.html for SPA routing
                  fs.readFile(path.join(__dirname, 'index.html'), (err2, data2) => {
                    if (err2) {
                      res.writeHead(404, { 'Content-Type': 'text/html' });
                      res.end('<h1>404 - File Not Found</h1>');
                    } else {
                      res.writeHead(200, { 'Content-Type': 'text/html' });
                      res.end(data2);
                    }
                  });
                } else {
                  res.writeHead(500, { 'Content-Type': 'text/html' });
                  res.end('<h1>500 - Internal Server Error</h1>');
                }
              } else {
                res.writeHead(200, { 'Content-Type': contentType });
                res.end(data);
              }
            });
          });
          
          const port = process.env.PORT || 8080;
          server.listen(port, () => {
            console.log(`Simple server started on port ${port}`);
            console.log(`Environment: ${process.env.NODE_ENV || 'development'}`);
          });
          EOF
          
          # Replace server.js with the simple server
          mv server-simple.js server.js
          echo "✅ Created simple server (no Express required)"

      - name: Ensure node_modules is included in artifact
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          echo "Creating .npmrc to ensure production dependencies"
          echo "production=true" > .npmrc
          echo "Creating .gitignore to ensure node_modules is not excluded"
          echo "!node_modules/" > .gitignore
          echo "Installing all dependencies to ensure completeness"
          npm install --production --no-optional
          echo "Final verification of node_modules:"
          ls -la node_modules/ | head -10
          echo "Express directory contents:"
          ls -la node_modules/express/ || echo "Express directory not found"
          echo "Total size of node_modules:"
          du -sh node_modules/ || echo "Could not calculate size"

      - name: Show directory structure before verification
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          echo "📁 Directory structure:"
          find . -type f -name "*.js" -o -name "*.json" -o -name "*.html" | head -20
          echo "📁 Node modules structure:"
          ls -la node_modules/ | head -10 || echo "node_modules not found"

      - name: Run deployment verification
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          # Create verification script inline
          cat > verify-deployment.js << 'EOF'
          #!/usr/bin/env node
          const fs = require('fs');
          const path = require('path');
          
          console.log('🔍 Verifying deployment package...');
          console.log('Current directory:', process.cwd());
          
          const requiredFiles = ['server.js', 'package.json', 'index.html'];
          const requiredDirs = ['node_modules', 'node_modules/express'];
          
          console.log('\n📁 Checking required files:');
          requiredFiles.forEach(file => {
            const exists = fs.existsSync(file);
            console.log(`  ${exists ? '✅' : '❌'} ${file}`);
            if (!exists) {
              console.error(`❌ Missing required file: ${file}`);
              process.exit(1);
            }
          });
          
          console.log('\n📁 Checking required directories:');
          requiredDirs.forEach(dir => {
            const exists = fs.existsSync(dir);
            console.log(`  ${exists ? '✅' : '❌'} ${dir}`);
            if (!exists) {
              console.error(`❌ Missing required directory: ${dir}`);
              process.exit(1);
            }
          });
          
          console.log('\n🔧 Testing Express module:');
          try {
            const express = require('express');
            console.log('✅ Express module loaded successfully');
            console.log(`   Version: ${require('./node_modules/express/package.json').version}`);
          } catch (error) {
            console.error('❌ Failed to load Express module:', error.message);
            process.exit(1);
          }
          
          console.log('\n✅ Deployment package verification completed successfully!');
          EOF
          node verify-deployment.js

      - name: Upload dynamic build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-build
          path: Dentriz.Configure.Web/dist/DentrizWeb/browser/
          retention-days: 7

  deploy-app-service:
    needs: build-dynamic
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dynamic build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dynamic-build
          path: ./dynamic-build

      - name: Verify deployment package
        run: |
          echo "Contents of deployment package:"
          ls -la ./dynamic-build/
          echo "Checking for node_modules:"
          ls -la ./dynamic-build/node_modules/ || echo "node_modules not found in package"
          echo "Checking for Express:"
          ls -la ./dynamic-build/node_modules/express/ || echo "Express not found in package"
          echo "Checking for server.js:"
          ls -la ./dynamic-build/server.js || echo "server.js not found"
          echo "Checking package.json:"
          cat ./dynamic-build/package.json || echo "package.json not found"
          echo "Testing Express module in deployment package:"
          cd ./dynamic-build
          node -e "try { const express = require('express'); console.log('✅ Express loaded successfully, version:', require('./node_modules/express/package.json').version); } catch(e) { console.error('❌ Express failed to load:', e.message); }"

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dynamic-build


  configure-app-settings:
    needs: deploy-app-service
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              ASPNETCORE_ENVIRONMENT=Production \
              API_BASE_URL=https://dentriz-configure-api.azurewebsites.net/api \
              NODE_ENV=production \
              WEBSITE_NODE_DEFAULT_VERSION=20.17.0 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_SKIP_CONTENTSHARE_VALIDATION=1 \
              WEBSITE_RUN_FROM_PACKAGE=0

      - name: Configure startup command
        run: |
          az webapp config set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --startup-file "node server.js"

  notify-deployment:
    needs: [deploy-app-service, configure-app-settings]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-app-service.result }}" == "success" ] && [ "${{ needs.configure-app-settings.result }}" == "success" ]; then
            echo "✅ Dynamic deployment successful!"
            echo "🌐 App Service URL: ${{ secrets.AZURE_WEBAPP_URL }}"
          else
            echo "❌ Dynamic deployment failed!"
            exit 1
          fi
