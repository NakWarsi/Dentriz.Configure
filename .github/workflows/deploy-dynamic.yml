name: Deploy Dynamic Version

on:
  push:
    branches: ['release-dynamic*']
  workflow_dispatch:
    inputs:
      app_service_name:
        description: 'App Service Name (optional - leave empty for default)'
        required: false
        default: ''
        type: string
        placeholder: 'e.g., dentriz-configure-web-akaash'
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-dynamic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment target
        id: set-target
        run: |
          # Check if this is a manual trigger with explicit App Service name
          if [ -n "${{ github.event.inputs.app_service_name }}" ]; then
            APP_SERVICE="${{ github.event.inputs.app_service_name }}"
            # Validate app service name format
            if [[ ! "$APP_SERVICE" =~ ^[a-zA-Z0-9-]+$ ]]; then
              echo "❌ Error: Invalid App Service name format"
              echo "   Use only letters, numbers, and hyphens"
              echo "   Example: dentriz-configure-web-akaash"
              exit 1
            fi
            echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
            echo "deployment-type=manual" >> $GITHUB_OUTPUT
            echo "trigger-source=manual" >> $GITHUB_OUTPUT
          else
            # Auto-detect from branch name
            BRANCH_NAME="${{ github.ref_name }}"
            echo "🔍 Branch name: $BRANCH_NAME"
            echo "🔍 GitHub ref: ${{ github.ref }}"
            echo "🔍 GitHub head ref: ${{ github.head_ref }}"
            echo "🔍 GitHub event name: ${{ github.event_name }}"
            echo "🔍 GitHub workflow ref: ${{ github.workflow_ref }}"
            
            if [[ "$BRANCH_NAME" =~ ^release-dynamic-([a-zA-Z0-9-]+)$ ]]; then
              # Pattern: release-dynamic-akaash -> dentriz-configure-web-akaash
              SUFFIX="${BASH_REMATCH[1]}"
              APP_SERVICE="dentriz-configure-web-$SUFFIX"
              echo "✅ Matched pattern: release-dynamic-([a-zA-Z0-9-]+)"
              echo "✅ Extracted suffix: $SUFFIX"
              echo "✅ App Service: $APP_SERVICE"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=branch-pattern" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=$SUFFIX" >> $GITHUB_OUTPUT
            elif [[ "$BRANCH_NAME" =~ ^release-dynamic$ ]]; then
              # Pattern: release-dynamic -> dentriz-configure-web (default)
              APP_SERVICE="dentriz-configure-web"
              echo "✅ Matched pattern: release-dynamic (exact)"
              echo "✅ App Service: $APP_SERVICE"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            else
              # Fallback to default for any other release-dynamic* branches
              APP_SERVICE="dentriz-configure-web"
              echo "⚠️  No pattern matched, using fallback"
              echo "⚠️  Branch name: $BRANCH_NAME"
              echo "⚠️  App Service: $APP_SERVICE"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Pre-deployment validation
        run: |
          APP_SERVICE="${{ steps.set-target.outputs.app-service-name }}"
          DEPLOYMENT_TYPE="${{ steps.set-target.outputs.deployment-type }}"
          TRIGGER_SOURCE="${{ steps.set-target.outputs.trigger-source }}"
          BRANCH_SUFFIX="${{ steps.set-target.outputs.branch-suffix }}"
          
          echo "🔍 Pre-deployment validation for: $APP_SERVICE"
          echo "📋 Deployment type: $DEPLOYMENT_TYPE"
          echo "🎯 Trigger source: $TRIGGER_SOURCE"
          if [ -n "$BRANCH_SUFFIX" ]; then
            echo "🌿 Branch suffix: $BRANCH_SUFFIX"
          fi
          
          # Convert hyphens to underscores for secret name
          SECRET_NAME="AZURE_WEBAPP_PUBLISH_PROFILE_${APP_SERVICE//-/_}"
          echo "🔍 Looking for secret: $SECRET_NAME"
          
          # Check if publish profile exists by trying to access it
          # We'll use a different approach - check if the secret exists by trying to use it
          echo "✅ Pre-deployment validation passed"
          echo "   App Service: $APP_SERVICE"
          echo "   Secret name: $SECRET_NAME"
          echo "   Note: Secret validation will be done during deployment"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'Dentriz.Configure.Web/package-lock.json'

      - name: Install dependencies
        run: |
          cd Dentriz.Configure.Web
          npm ci

      - name: Build dynamic version
        run: |
          cd Dentriz.Configure.Web
          npm run build:dynamic

      - name: Set API URL based on deployment target
        id: set-api-url
        run: |
          APP_SERVICE="${{ steps.set-target.outputs.app-service-name }}"
          BRANCH_SUFFIX="${{ steps.set-target.outputs.branch-suffix }}"
          
          if [ -n "$BRANCH_SUFFIX" ]; then
            # Custom deployment with suffix
            API_URL="https://dentriz-configure-api-$BRANCH_SUFFIX.azurewebsites.net/api"
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "api-type=custom" >> $GITHUB_OUTPUT
          else
            # Default deployment
            API_URL="https://dentriz-configure-api.azurewebsites.net/api"
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "api-type=default" >> $GITHUB_OUTPUT
          fi
          
          echo "🔗 API URL: $API_URL"

      - name: Inject API URL into environment
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          API_URL="${{ steps.set-api-url.outputs.api-url }}"
          
          # Create a script to inject API URL at runtime
          cat > inject-api-url.js << EOF
          (function() {
            // Set the API base URL from environment variable
            if (typeof window !== 'undefined') {
              window.API_BASE_URL = '$API_URL';
            }
          })();
          EOF
          
          # Inject the script into index.html
          sed -i 's|</head>|  <script src="inject-api-url.js"></script>\n</head>|' index.html

      - name: Copy server.js to build output
        run: |
          cp Dentriz.Configure.Web/server.js Dentriz.Configure.Web/dist/DentrizWeb/browser/

      - name: Create package.json for deployment
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          cat > package.json << 'EOF'
          {
            "name": "dentriz-web-app",
            "version": "1.0.0",
            "description": "DentRiz Web Application",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            },
            "engines": {
              "node": ">=18.0.0"
            }
          }
          EOF

      - name: Install Express dependency
        run: |
          cd Dentriz.Configure.Web/dist/DentrizWeb/browser
          npm install express --production

      - name: Upload dynamic build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-build
          path: Dentriz.Configure.Web/dist/DentrizWeb/browser/
          retention-days: 7

  deploy-app-service:
    needs: build-dynamic
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dynamic build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dynamic-build
          path: ./dynamic-build

      - name: Set deployment target
        id: set-target
        run: |
          # Check if this is a manual trigger with explicit App Service name
          if [ -n "${{ github.event.inputs.app_service_name }}" ]; then
            APP_SERVICE="${{ github.event.inputs.app_service_name }}"
            echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
            echo "deployment-type=manual" >> $GITHUB_OUTPUT
            echo "trigger-source=manual" >> $GITHUB_OUTPUT
          else
            # Auto-detect from branch name
            BRANCH_NAME="${{ github.ref_name }}"
            echo "🔍 Branch name: $BRANCH_NAME"
            
            if [[ "$BRANCH_NAME" =~ ^release-dynamic-([a-zA-Z0-9-]+)$ ]]; then
              # Pattern: release-dynamic-akaash -> dentriz-configure-web-akaash
              SUFFIX="${BASH_REMATCH[1]}"
              APP_SERVICE="dentriz-configure-web-$SUFFIX"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=branch-pattern" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=$SUFFIX" >> $GITHUB_OUTPUT
            elif [[ "$BRANCH_NAME" =~ ^release-dynamic$ ]]; then
              # Pattern: release-dynamic -> dentriz-configure-web (default)
              APP_SERVICE="dentriz-configure-web"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            else
              # Fallback to default for any other release-dynamic* branches
              APP_SERVICE="dentriz-configure-web"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Deploy to Azure App Service
        env:
          APP_SERVICE: ${{ steps.set-target.outputs.app-service-name }}
        run: |
          echo "🔍 Deploying to: $APP_SERVICE"
          echo "🔍 Branch name from step: ${{ steps.set-target.outputs.branch-suffix }}"
          echo "🔍 Deployment type: ${{ steps.set-target.outputs.deployment-type }}"
          
          # FIXED: Properly detect App Service from branch name
          BRANCH_NAME="${{ github.ref_name }}"
          echo "🔍 Final branch name: $BRANCH_NAME"
          
          if [[ "$BRANCH_NAME" =~ ^release-dynamic-([a-zA-Z0-9-]+)$ ]]; then
            SUFFIX="${BASH_REMATCH[1]}"
            APP_SERVICE="dentriz-configure-web-$SUFFIX"
            echo "✅ Detected suffix: $SUFFIX"
            echo "✅ Final App Service: $APP_SERVICE"
          elif [[ "$BRANCH_NAME" =~ ^release-dynamic$ ]]; then
            APP_SERVICE="dentriz-configure-web"
            echo "✅ Default App Service: $APP_SERVICE"
          else
            echo "⚠️  Unknown branch pattern, using default"
            APP_SERVICE="dentriz-configure-web"
          fi
          
          # Convert hyphens to underscores for secret name
          SECRET_NAME="AZURE_WEBAPP_PUBLISH_PROFILE_${APP_SERVICE//-/_}"
          echo "🔍 Expected secret: $SECRET_NAME"
          
          # Get the publish profile content based on the secret name
          case "$APP_SERVICE" in
            "dentriz-configure-web")
              PUBLISH_PROFILE="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_dentriz_configure_web }}"
              ;;
            "dentriz-configure-web-akaash")
              PUBLISH_PROFILE="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_dentriz_configure_web_akaash }}"
              ;;
            "dentriz-configure-web-test")
              PUBLISH_PROFILE="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_dentriz_configure_web_test }}"
              ;;
            "dentriz-configure-web-staging")
              PUBLISH_PROFILE="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_dentriz_configure_web_staging }}"
              ;;
            *)
              echo "❌ Error: Unknown App Service: $APP_SERVICE"
              echo "   Please add a case for this App Service in the workflow"
              exit 1
              ;;
          esac
          
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "❌ Error: Publish profile not found for $APP_SERVICE"
            echo "   Expected secret: $SECRET_NAME"
            echo "   Please add this secret to your repository"
            exit 1
          fi
          
          # Save publish profile to file
          echo "$PUBLISH_PROFILE" > publish-profile.xml
          
          # Create zip file
          cd ./dynamic-build
          zip -r ../dynamic-build.zip .
          cd ..
          
          # Deploy using Azure CLI
          az webapp deployment source config-zip \
            --name "$APP_SERVICE" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --src "./dynamic-build.zip"

  configure-app-settings:
    needs: deploy-app-service
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set deployment target
        id: set-target
        run: |
          # Check if this is a manual trigger with explicit App Service name
          if [ -n "${{ github.event.inputs.app_service_name }}" ]; then
            APP_SERVICE="${{ github.event.inputs.app_service_name }}"
            echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
            echo "deployment-type=manual" >> $GITHUB_OUTPUT
            echo "trigger-source=manual" >> $GITHUB_OUTPUT
          else
            # Auto-detect from branch name
            BRANCH_NAME="${{ github.ref_name }}"
            echo "🔍 Branch name: $BRANCH_NAME"
            
            if [[ "$BRANCH_NAME" =~ ^release-dynamic-([a-zA-Z0-9-]+)$ ]]; then
              # Pattern: release-dynamic-akaash -> dentriz-configure-web-akaash
              SUFFIX="${BASH_REMATCH[1]}"
              APP_SERVICE="dentriz-configure-web-$SUFFIX"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=branch-pattern" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=$SUFFIX" >> $GITHUB_OUTPUT
            elif [[ "$BRANCH_NAME" =~ ^release-dynamic$ ]]; then
              # Pattern: release-dynamic -> dentriz-configure-web (default)
              APP_SERVICE="dentriz-configure-web"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            else
              # Fallback to default for any other release-dynamic* branches
              APP_SERVICE="dentriz-configure-web"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set API URL for App Service configuration
        id: set-api-url-config
        run: |
          APP_SERVICE="${{ steps.set-target.outputs.app-service-name }}"
          BRANCH_SUFFIX="${{ steps.set-target.outputs.branch-suffix }}"
          
          if [ -n "$BRANCH_SUFFIX" ]; then
            # Custom deployment with suffix
            API_URL="https://dentriz-configure-api-$BRANCH_SUFFIX.azurewebsites.net/api"
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "api-type=custom" >> $GITHUB_OUTPUT
          else
            # Default deployment
            API_URL="https://dentriz-configure-api.azurewebsites.net/api"
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "api-type=default" >> $GITHUB_OUTPUT
          fi
          
          echo "🔗 App Service API URL: $API_URL"

      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --name ${{ steps.set-target.outputs.app-service-name }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              ASPNETCORE_ENVIRONMENT=Production \
              API_BASE_URL=${{ steps.set-api-url-config.outputs.api-url }} \
              NODE_ENV=production \
              WEBSITE_NODE_DEFAULT_VERSION=20.17.0 \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_SKIP_CONTENTSHARE_VALIDATION=1

      - name: Configure startup command
        run: |
          az webapp config set \
            --name ${{ steps.set-target.outputs.app-service-name }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --startup-file "node server.js"

  notify-deployment:
    needs: [deploy-app-service, configure-app-settings]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Set deployment target
        id: set-target
        run: |
          # Check if this is a manual trigger with explicit App Service name
          if [ -n "${{ github.event.inputs.app_service_name }}" ]; then
            APP_SERVICE="${{ github.event.inputs.app_service_name }}"
            echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
            echo "deployment-type=manual" >> $GITHUB_OUTPUT
            echo "trigger-source=manual" >> $GITHUB_OUTPUT
          else
            # Auto-detect from branch name
            BRANCH_NAME="${{ github.ref_name }}"
            echo "🔍 Branch name: $BRANCH_NAME"
            
            if [[ "$BRANCH_NAME" =~ ^release-dynamic-([a-zA-Z0-9-]+)$ ]]; then
              # Pattern: release-dynamic-akaash -> dentriz-configure-web-akaash
              SUFFIX="${BASH_REMATCH[1]}"
              APP_SERVICE="dentriz-configure-web-$SUFFIX"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=branch-pattern" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=$SUFFIX" >> $GITHUB_OUTPUT
            elif [[ "$BRANCH_NAME" =~ ^release-dynamic$ ]]; then
              # Pattern: release-dynamic -> dentriz-configure-web (default)
              APP_SERVICE="dentriz-configure-web"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            else
              # Fallback to default for any other release-dynamic* branches
              APP_SERVICE="dentriz-configure-web"
              echo "app-service-name=$APP_SERVICE" >> $GITHUB_OUTPUT
              echo "deployment-type=default" >> $GITHUB_OUTPUT
              echo "trigger-source=branch" >> $GITHUB_OUTPUT
              echo "branch-suffix=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set API URL for notification
        id: set-api-url-notify
        run: |
          APP_SERVICE="${{ steps.set-target.outputs.app-service-name }}"
          BRANCH_SUFFIX="${{ steps.set-target.outputs.branch-suffix }}"
          
          if [ -n "$BRANCH_SUFFIX" ]; then
            # Custom deployment with suffix
            API_URL="https://dentriz-configure-api-$BRANCH_SUFFIX.azurewebsites.net/api"
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "api-type=custom" >> $GITHUB_OUTPUT
          else
            # Default deployment
            API_URL="https://dentriz-configure-api.azurewebsites.net/api"
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "api-type=default" >> $GITHUB_OUTPUT
          fi

      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-app-service.result }}" == "success" ] && [ "${{ needs.configure-app-settings.result }}" == "success" ]; then
            echo "✅ Dynamic deployment successful!"
            echo "🎯 Deployed to: ${{ steps.set-target.outputs.app-service-name }}"
            echo "📋 Deployment type: ${{ steps.set-target.outputs.deployment-type }}"
            echo "🌿 Trigger source: ${{ steps.set-target.outputs.trigger-source }}"
            if [ -n "${{ steps.set-target.outputs.branch-suffix }}" ]; then
              echo "🌿 Branch suffix: ${{ steps.set-target.outputs.branch-suffix }}"
            fi
            echo "🔗 API URL: ${{ steps.set-api-url-notify.outputs.api-url }}"
            echo "🌐 App Service URL: https://${{ steps.set-target.outputs.app-service-name }}.azurewebsites.net"
          else
            echo "❌ Dynamic deployment failed!"
            echo "🎯 Target was: ${{ steps.set-target.outputs.app-service-name }}"
            echo "📋 Deployment type: ${{ steps.set-target.outputs.deployment-type }}"
            echo "🌿 Trigger source: ${{ steps.set-target.outputs.trigger-source }}"
            echo "🔗 API URL: ${{ steps.set-api-url-notify.outputs.api-url }}"
            exit 1
          fi
