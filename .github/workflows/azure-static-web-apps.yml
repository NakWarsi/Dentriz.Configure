name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - no-edit
  # pull_request:
  #   types: [opened, synchronize, reopened, closed]
  #   branches:
  #     - no-edit

jobs:
  build_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Dentriz.Configure.Web/package-lock.json'
      
      - name: Install Dependencies
        working-directory: ./Dentriz.Configure.Web
        run: npm ci
      
      - name: Build Application
        working-directory: ./Dentriz.Configure.Web
        run: npm run build:static
      
      - name: List Build Output
        working-directory: ./Dentriz.Configure.Web
        run: |
          echo "Build output structure:"
          ls -la dist/
          ls -la dist/DentrizWeb/
          ls -la dist/DentrizWeb/browser/
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Dentriz.Configure.Web/dist/DentrizWeb/browser
          retention-days: 1

  deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy Job
    needs: build_job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./build-output
      
      - name: Verify Build Artifacts
        run: |
          echo "Downloaded artifacts structure:"
          ls -la build-output/
          echo "Looking for index.html:"
          find build-output/ -name "index.html" -type f
      
      - name: Move Artifacts to Root
        run: |
          echo "Moving artifacts from build-output to root directory"
          cp -r build-output/* ./
          echo "Files in root directory:"
          ls -la
          echo "Looking for index.html in root:"
          find . -name "index.html" -type f -maxdepth 2
      
      - name: Deploy to Azure Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true

