name: Deploy to GitHub Pages

on:
  push:
    branches:
      - no-edit-akaash
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Dentriz.Configure.Web/package-lock.json'
      
      - name: Install Dependencies
        working-directory: ./Dentriz.Configure.Web
        run: npm ci
      
      - name: Build Application
        working-directory: ./Dentriz.Configure.Web
        run: npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Dentriz.Configure.Web/dist/DentrizWeb/browser
          cname: false

