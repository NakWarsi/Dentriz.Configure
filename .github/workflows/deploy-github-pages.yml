name: Deploy to GitHub Pages

on:
  push:
    branches:
      - no-edit-akaash
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Dentriz.Configure.Web/package-lock.json'
      
      - name: Install Dependencies
        working-directory: ./Dentriz.Configure.Web
        run: npm ci
      
      - name: Build Application
        working-directory: ./Dentriz.Configure.Web
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Dentriz.Configure.Web/dist/DentrizWeb/browser
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./dist
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: false
      
      - name: Display deployment URL
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          echo "::notice title=Deployment Successful::Your site is live at: https://${OWNER}.github.io/${REPO_NAME}/"
          echo ""
          echo "✅ Deployment successful!"
          echo "🌐 Site URL: https://${OWNER}.github.io/${REPO_NAME}/"
        if: success()

